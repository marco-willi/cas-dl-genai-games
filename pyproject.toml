[project]
name = "genai-cv-game"
version = "0.1.0"
description = "Interactive generative AI classroom game for computer vision courses"
authors = [{ name = "Marco Willi", email = "mwilli-dev@pm.me" }]
requires-python = ">=3.14"
dependencies = [
  # App
  "streamlit",
  "replicate",
  "requests",
  # Utilities
  "pydantic>=2,<3",
  "python-dotenv",
  # Visualization
  "Pillow",
]

[dependency-groups]
dev = ["pytest", "pytest-cov>=7.1.0", "mypy", "pre-commit", "ruff"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genai_cv_game"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/genai_cv_game --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
omit = ["src/genai_cv_game/ui/*"]

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
